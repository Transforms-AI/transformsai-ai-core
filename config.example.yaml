# transformsai-ai-core 5.0 example config.
# Generated by `transformsaicore config example`; regenerate instead of editing.
#
# Only a few keys are required: node.sn, each camera's source, api.base_url
# (when api is enabled), mediamtx.host (when a stream is enabled), and one of
# path / download_key / type per model. Everything else shows its default.
#
# Every `settings: {}` belongs to the project: core never inspects it. Any other
# unknown key is reported -- an error under `transformsaicore config validate`
# (strict, the pre-deploy gate), a warning at runtime load (lenient).
#
# Durations take seconds or a unit ("500ms", "3s", "2m", "1h");
# bitrates take "800k", "1.2M" or bits/s.

node:                                         # REQUIRED. The node's identity
  sn: node-0001                               # REQUIRED. Node serial number: the one node identity
  version: 1.0.0                              # Optional node/project version
  settings: {}                                # Project-owned settings for the node; core never inspects them

cameras:                                      # Cameras by name (a plain list is named camera_0, camera_1, ...)
  surveillance:
    source:                                   # REQUIRED. Where the camera reads from; `type` is rtsp, device, file or url
      type: rtsp                              # REQUIRED. Source type
      host: 192.168.1.64                      # REQUIRED. Camera host name or IP
      port: 554                               # RTSP port
      user: admin                             # RTSP user name
      password: CHANGEME                      # RTSP password (secret: URL-encoded in the URL, masked in dumps and logs)
      path: /Streaming/Channels/101           # Stream path on the camera
      transport: tcp                          # RTSP transport: tcp, udp, or null to let FFmpeg negotiate (also used for camera audio)
      # or: {type: device, path: /dev/video0}
      # or: {type: file, path: videos/sample.mp4}
      # or: {type: url, url: 'rtsp://10.0.0.11/stream1'}
    capture:                                  # Capture options (VideoCaptureAsync)
      width: 1280                             # Capture width in pixels (null = native; needs height too)
      height: 720                             # Capture height in pixels (null = native; needs width too)
      fps: 10                                 # Target frames per second (null = native)
      buffer_size: 1                          # OpenCV buffer size for network/file sources (1 = minimal lag)
      max_frame_age: null                     # read() drops frames older than this, e.g. '500ms' (null = never)
      auto_resize: true                       # Resize in software when the source ignores width/height
      hw_decode: false                        # Ask OpenCV for hardware-accelerated decoding
      open_timeout: 5                         # Network open/read timeout in seconds, passed to FFmpeg (0 = FFmpeg default)
      ffmpeg_options: null                    # Verbatim OPENCV_FFMPEG_CAPTURE_OPTIONS override
      health_log_interval: 60                 # Seconds between capture health log lines (0 = off)
      restart:                                # Reconnect policy
        enabled: true                         # Reconnect automatically after a failure
        delay: 30                             # Backoff ceiling in seconds: delays double from backoff_start up to this
        backoff_start: 1                      # First reconnect delay in seconds
        jitter: 0.2                           # +/- fraction applied to each delay so cameras don't reconnect in lockstep (capped at 1)
        reset_after: 30                       # Seconds of healthy streaming before the backoff starts over
        max_attempts: null                    # Consecutive reconnect attempts before giving up (null = forever)
        stall_timeout: null                   # Seconds without a decoded frame before forcing a reconnect (null = auto max(5, 20/fps); 0 = off)
    stream:                                   # This camera's livestream (null = none)
      enabled: true                           # Publish this camera's stream
      name: '{sn}_{camera}'                   # Stream name after the fixed 'cam_sn_' prefix; placeholders {sn} (node.sn), {camera} (camera name), {index} (camera position)
      width: null                             # Stream width (null = capture.width, else the first frame's)
      height: null                            # Stream height (null = capture.height, else the first frame's)
      fps: null                               # Stream fps (null = capture.fps, else 15)
      bitrate: 800k                           # Video bitrate, e.g. '800k', '1.2M' or bits/s
      on_demand: true                         # Publish only while a viewer is watching (polls mediamtx demand_url)
      debug_log_interval: 60                  # Seconds between performance debug log lines
      encoder:                                # Video encoder
        preset: ultrafast                     # x264-style preset (mapped for hardware encoders)
        codec: libx264                        # libx264, 'auto' (first available hardware encoder, else libx264), or an FFmpeg H.264 encoder name
        queue_size: 2                         # Async frame queue depth (0 = write synchronously)
      audio:                                  # Optional audio track (null = video only)
        input:                                # REQUIRED. Where the audio comes from: {type: alsa, device: ...} or {type: camera}
          type: camera                        # REQUIRED. Audio input type
          # or: {type: alsa, device: 'plughw:1,0'}
        filter:                               # Filter chain
          # highpass_hz: 300                  # High-pass cutoff in Hz. Unset: 20 for alsa, off for camera. 0/null = off. Above 20 a 4th-order filter is used
          # gain_db: 18                       # Makeup gain in dB (through the limiter). Unset: 18 for alsa, 0 for camera. 0/null = no gain and no limiter
          limiter: 0.97                       # Limiter ceiling (0-1] applied after gain; null = no limiter
        bitrate: 24k                          # Opus bitrate
        retry:                                # Retry policy after an audio failure
          backoff: 60                         # First audio retry delay in seconds; doubles while failing
          backoff_max: 900                    # Audio retry delay ceiling in seconds
          reset_after: 60                     # Seconds a run must keep audio before the backoff starts over
        settings: {}                          # Project-owned settings for the audio track; core never inspects them
      settings: {}                            # Project-owned settings for the stream; core never inspects them
    settings: {}                              # Project-owned settings for the camera; core never inspects them
  ocr:
    source:                                   # REQUIRED. Where the camera reads from; `type` is rtsp, device, file or url
      type: device                            # REQUIRED. Source type
      path: /dev/video0                       # Device node, e.g. /dev/video0 or a udev symlink (or use `index`)
      # or: {type: rtsp, host: 192.168.1.64}
      # or: {type: file, path: videos/sample.mp4}
      # or: {type: url, url: 'rtsp://10.0.0.11/stream1'}

mediamtx:                                     # Stream server shared by every camera's stream (null = no streaming)
  host: mediamtx.example.com                  # Server host name or IP (required when any stream is enabled)
  rtsp_port: 8554                             # RTSP port streams are published to
  webrtc_port: 8889                           # WebRTC port (used in the default webrtc_url for a bare-IP host)
  demand:                                     # On-demand polling
    poll_interval: 3                          # Seconds between demand polls
    grace_period: 10                          # Seconds demand must stay off before FFmpeg is stopped
    timeout: 5                                # HTTP timeout per demand poll in seconds
  rtsp_url: null                              # Publish URL template (null = rtsp://{host}:{rtsp_port}/live/{name})
  webrtc_url: null                            # Viewer URL template (null = https://{host}/live/{name}/, or http://{host}:{webrtc_port}/live/{name}/ for a bare IP)
  demand_url: null                            # Demand flag URL template (null = https://{host}/demand/{name})
  settings: {}                                # Project-owned settings for the stream server; core never inspects them

api:                                          # HTTP API client (null = not configured)
  enabled: true                               # Use the API client (the project checks this flag)
  base_url: https://api.example.com/api/v1/   # API base URL (required when enabled)
  timeout: 30                                 # Request timeout in seconds
  headers: {}                                 # Headers sent with every request
  auth_keys: []                               # Auth keys, rotated per request (secret)
  auth_header: X-Secret-Key                   # Header that carries the auth key
  content_type: auto                          # Default body encoding
  success_codes: [200, 201, 202, 204]         # HTTP statuses counted as success
  retries:                                    # Per-request retries
    max: 3                                    # Retries after the first attempt (0 = single attempt)
    backoff: 1                                # First retry delay in seconds; doubles each retry
    backoff_max: 30                           # Retry delay ceiling in seconds
    on_status: [408, 429, 500, 502, 503, 504]  # HTTP statuses that are retried
  outbox:                                     # Disk outbox for failed writes
    enabled: true                             # Keep failed writes on disk and retry them
    dir: .core-api-cache                      # Outbox directory
    retry_interval: 100                       # Seconds between background retry passes (0 = no background retries)
    max_items: 300                            # Most requests kept, oldest dropped first (0/null = unbounded)
    max_age: 86400                            # Drop requests older than this, e.g. '24h' (0/null = never)
    max_retries: 5                            # Background retries before a request is dropped (null = unbounded; 0 = never retried)
  pool:                                       # Connection pool and workers
    connections: 10                           # Connection pools to cache
    maxsize: 10                               # Connections per pool
    workers: null                             # Threads for async requests (null = min(2, cpu_count))
  endpoints:                                  # Named endpoints: name -> path, or a full profile
    heartbeat: telemetry/heartbeats/
  settings: {}                                # Project-owned settings for the API client; core never inspects them

models:                                       # Inference models by name
  person-det:
    path: models/yolo11n.pt                   # Model file or directory, relative to the config's directory
    download_key: null                        # Download the model by key
    type: null                                # Model category; downloads the latest model of this type
    task: detect                              # Ultralytics task: detect, segment, classify, pose, obb
    batch: 1                                  # Inference batch size
    export: false                             # Export to an optimised format on first load
    export_options: {}                        # Passed to ultralytics export() as-is (e.g. format: onnx)
    set_classes: null                         # YOLOE only: text prompts used as the class list
    settings: {}                              # Project-owned settings for the model; core never inspects them

logging:                                      # Core logging sinks
  console_level: INFO                         # Console sink level (OFF/null = no console sink)
  file_level: DEBUG                           # JSONL file sink level, .core-logs/ (OFF/null = no file sink)
  settings: {}                                # Project-owned settings for logging; core never inspects them

settings: {}                                  # Project-owned settings for the project; core never inspects them

# ------------------------------------------------------------------------------
# How a project adds its own settings and validators
# ------------------------------------------------------------------------------
# Project keys go in a `settings` block: the top-level one for project-wide
# data, or the one on the object they belong to (a camera, a stream, a model).
#
# To have the same gate check them, register validators before loading:
#
#     from pydantic import BaseModel, ConfigDict
#     from transformsai_ai_core.config import (
#         load_config, register_secret, register_validator)
#
#     class MeterSettings(BaseModel):
#         model_config = ConfigDict(extra="forbid")   # report typos too
#         read_interval: float = 60.0
#
#     register_validator("settings.meter", MeterSettings)
#     register_validator("cameras.*.settings.flash", check_flash)  # a function
#     register_secret("settings.modbus.password")   # masked + redacted in logs
#
#     config, report = load_config("config.yaml")
#
# A function validator returns None/True, False, a message, an Issue, or a
# list of those (or raises ValueError). Failures are errors in strict mode and
# warnings in lenient mode -- pass required=True to make a lenient load refuse
# the config.
